<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- Large A (serif, gold) - left side -->
  <path d="M30 105 L55 30 L80 105" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="80" x2="70" y2="80" stroke="#D4AF37" stroke-width="2.5"/>
  
  <!-- Large S (script, emerald) - right side, slightly overlapping A -->
  <path d="M105 35 C 90 25, 75 30, 75 45 C 75 60, 90 65, 105 70 C 120 75, 135 75, 135 90 C 135 105, 120 110, 105 110 C 95 110, 88 105, 85 98" fill="none" stroke="#1C3B32" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Brand text: AURA -->
  <text x="100" y="122" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#1C3B32" text-anchor="middle">AURA</text>
  <!-- AND -->
  <text x="100" y="133" font-family="Georgia, serif" font-size="8" letter-spacing="4" fill="#1C3B32" text-anchor="middle">AND</text>
  <!-- SCAPE -->
  <text x="100" y="143" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#1C3B32" text-anchor="middle">SCAPE</text>
  
  <!-- Floral accent - top of S -->
  <circle cx="95" cy="18" r="4" fill="#D9A2A8"/>
  <circle cx="103" cy="13" r="3.5" fill="#E8C4C8"/>
  <circle cx="88" cy="14" r="3" fill="#D9A2A8"/>
  <circle cx="99" cy="22" r="2.5" fill="#E8C4C8"/>
  <!-- Petal outlines -->
  <ellipse cx="95" cy="18" rx="5" ry="2.5" fill="none" stroke="#D9A2A8" stroke-width="0.6" transform="rotate(-20 95 18)"/>
  <ellipse cx="103" cy="13" rx="4.5" ry="2" fill="none" stroke="#E8C4C8" stroke-width="0.6" transform="rotate(15 103 13)"/>
  <!-- Stems -->
  <path d="M92 24 Q90 30, 86 34" fill="none" stroke="#5A8C6A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M98 24 Q100 30, 104 33" fill="none" stroke="#5A8C6A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="86" cy="34" rx="2.5" ry="4" fill="#5A8C6A" transform="rotate(-25 86 34)"/>
  <ellipse cx="104" cy="33" rx="2.5" ry="4" fill="#7BA888" transform="rotate(20 104 33)"/>
  <!-- Small buds -->
  <circle cx="84" cy="20" r="1.8" fill="#E8C4C8"/>
  <circle cx="108" cy="18" r="1.8" fill="#D9A2A8"/>
</svg>
