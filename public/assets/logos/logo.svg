<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100">
  <!-- Large script S -->
  <text x="45" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" fill="#1B4D4A" font-style="italic">S</text>
  <!-- Smaller A overlapping -->
  <text x="18" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" fill="#C9A96E">A</text>
  
  <!-- Brand text -->
  <text x="70" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#1B4D4A" text-anchor="middle">AURA</text>
  <text x="70" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="7" letter-spacing="2" fill="#1B4D4A" text-anchor="middle">AND</text>
  <text x="70" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#1B4D4A" text-anchor="middle">SCAPE</text>
  
  <!-- Floral accent - top left -->
  <circle cx="30" cy="18" r="3" fill="#E8788A"/>
  <circle cx="35" cy="14" r="2.5" fill="#F2A0B0"/>
  <circle cx="26" cy="14" r="2" fill="#E8788A"/>
  <path d="M28 22 Q26 28, 22 30" fill="none" stroke="#5A8C6A" stroke-width="1" stroke-linecap="round"/>
  <path d="M32 20 Q34 26, 38 28" fill="none" stroke="#5A8C6A" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="22" cy="30" rx="2" ry="3" fill="#5A8C6A" transform="rotate(-30 22 30)"/>
  <ellipse cx="38" cy="28" rx="2" ry="3" fill="#5A8C6A" transform="rotate(20 38 28)"/>
  
  <!-- Small leaf accents -->
  <ellipse cx="55" cy="12" rx="1.5" ry="3" fill="#7BA888" transform="rotate(15 55 12)"/>
  <ellipse cx="60" cy="10" rx="1.5" ry="2.5" fill="#5A8C6A" transform="rotate(-10 60 10)"/>
</svg>
